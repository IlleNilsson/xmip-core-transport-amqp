[package]
name = "xmip-core-transport-amqp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-amqp"
description = "AMQP 0-9-1 transport: one publish or delivery is one Stream, the exchange and routing key beside it; a Location consumes a queue or publishes through a broker, or accepts clients directly. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Codec and the standard library otherwise:
# AMQP is a frame and typed arguments. Its declaration takes the
# capability's `timeout` (`transport::configured::timeout`).
transport = { workspace = true }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { workspace = true, optional = true }
# The estate's encoding primitives: the byte cursor and writer AMQP 0-9-1 is read and written over.
codec = { workspace = true, optional = true }
# The event capability's wire (ADR-0065 clause 3): the Wire this crate
# implements, the Carried it puts in a message's properties and the Rules
# its AMQP binding answers by — the two modes over them are written
# there, once, and the AMQP binding's prefixes here. Every node links it
# already, through the runtime; a Technology may depend on Foundation
# (repository-model.md section 4).
event = { workspace = true, optional = true }
# The most a connection is read for: the ceiling a content header's body
# size is held to.
net = { workspace = true, optional = true }
# The Party a Wire carries to, by identifier, and the settings this
# technology declares (xcore::settings).
xcore = { workspace = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:context", "dep:codec", "dep:event", "dep:net"]
# The declaration alone, with `presenting`'s `user` and `virtual_host`.
declaration = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The test cluster's names, from its `cluster.xmip` (`configure::fixture`;
# ADR-0056, amendment 2026-10-03): no test writes a cluster or node name.
configure = { workspace = true, features = ["test-support"] }
# The policy the forwarding tests hand their hub, allowing their Party:
# the authorize capability's party technology. Being in the process admits
# nobody.
authorize-party = { workspace = true }
# The loopback payloads and the latency spread the tests drive, from the
# capability's test support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }
# The hub the forwarding tests subscribe to, the forwarder they carry
# through and the subscriber they subscribe as, a proven caller the
# delivery's test fixture builds (`delivery::subscriber::fixture`): test
# support, as every crate's fixture is, and never a production build
# (ADR-0065, amendment 2026-11-13).
xcluster = { workspace = true, default-features = false, features = ["test-support"] }
# The processor time an Event's threads used, which the tests hold.
xcore = { workspace = true, features = ["test-support"] }
# The forwarding tests: a subscriber's audit, the stage an Event reports,
# and one real retry guard.
audit = { workspace = true }
# The sink that audit keeps its records in, read back from the file, and
# the test's own folder it writes in, removed once audit's keeper kept them
# (`audit_file::temporary`).
audit-file = { workspace = true, features = ["test-support"] }
node = { workspace = true }
# The guard the event-wire tests judge an attempt by (`resilience::Guard`);
# the library itself uses none of the capability (unused_dependencies).
resilience = { workspace = true }
retry = { workspace = true }

[lints]
workspace = true
